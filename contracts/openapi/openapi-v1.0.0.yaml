x-architecture:
  style: modular-monolith
  idempotency: required for financial and critical commands
  audit: all state-changing commands emit audit records
  outbox: domain/integration events use transactional outbox
  tenant_isolation: application authorization plus PostgreSQL RLS
  money: decimal semantics; never binary floating point in persistence
  timezone: timestamps are UTC; store-local timezone belongs to organization/store
    context
