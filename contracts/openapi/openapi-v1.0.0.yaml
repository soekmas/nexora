components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant context. Server must validate user scope.
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
      description: Caller correlation ID; server generates one when absent.
    IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Required for retryable financial/business commands; same key with
        different request hash is rejected.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission or scope denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, concurrency, idempotency, or business conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Business/input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false
      properties: {}
    EmptyResponse:
      type: object
      additionalProperties: false
      properties: {}
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
      required:
      - error
      - request_id
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
        mfa_code:
          type: string
      required:
      - username
      - password
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          type: string
        code:
          type: string
      required:
      - challenge_id
      - code
    AuthResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/UserContext'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    UserContext:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        tenant_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        region_ids:
          type: array
          items:
            type: string
            format: uuid
        store_ids:
          type: array
          items:
            type: string
            format: uuid
        warehouse_ids:
          type: array
          items:
            type: string
            format: uuid
        terminal_ids:
          type: array
          items:
            type: string
            format: uuid
        permissions:
          type: array
          items:
            type: string
    HeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        app_version:
          type: string
        device_time:
          type: string
          format: date-time
    ProductCreateRequest:
      type: object
      additionalProperties: false
      properties:
        sku:
          type: string
        name:
          type: string
        brand_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        uom_id:
          type: string
          format: uuid
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
      required:
      - sku
      - name
    ProductUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        brand_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        uom_id:
          type: string
          format: uuid
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
      required:
      - reason
    BarcodeCreateRequest:
      type: object
      additionalProperties: false
      properties:
        barcode:
          type: string
        type:
          type: string
      required:
      - barcode
    Barcode:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        barcode:
          type: string
        type:
          type: string
        product_variant_id:
          type: string
          format: uuid
    ProductVariant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        product_id:
          type: string
          format: uuid
        price:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
        active:
          type: boolean
    Product:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        brand_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        active:
          type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
    CustomerCreateRequest:
      type: object
      additionalProperties: false
      properties:
        customer_no:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        group_id:
          type: string
          format: uuid
      required:
