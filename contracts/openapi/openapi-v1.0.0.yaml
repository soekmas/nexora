openapi: 3.0.3
info:
  title: NEXORA Retail Business Platform API
  version: 1.0.0
  description: Enterprise POS / Retail Platform API. Modular-monolith, API-first,
    tenant-aware, idempotent, audit-ready, and ERP-ready.
servers:
- url: https://api.example.com/api/v1
  description: Production placeholder
- url: https://staging-api.example.com/api/v1
  description: Staging placeholder
tags:
- name: Auth
- name: Organization
- name: Master Data
- name: CRM
- name: Pricing
- name: Promotion
- name: POS
- name: Sales
- name: Payment
- name: Inventory
- name: Purchasing
- name: Loyalty
- name: Voucher
- name: Workflow
- name: Audit
- name: Integration
- name: Reporting
security:
