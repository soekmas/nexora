    AddressCreateRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        recipient_name:
          type: string
        phone:
          type: string
        address_line1:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
        country_code:
          type: string
    Address:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        recipient_name:
          type: string
        phone:
          type: string
        address_line1:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
        country_code:
          type: string
    PriceQuoteRequest:
      type: object
      additionalProperties: false
      properties:
        store_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        currency:
          type: string
        channel:
          type: string
          description: Channel context for pricing resolution (default POS)
        price_list_id:
          type: string
          format: uuid
          description: Optional explicit price list override
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
      required:
      - store_id
      - currency
      - items
    CartItem:
      type: object
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: number
          minimum: 0.001
        unit_price:
          type: number
          format: double
          minimum: 0
    PriceQuote:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceQuoteItem'
        subtotal:
          type: number
          format: double
          minimum: 0
        discount_total:
          type: number
          format: double
          minimum: 0
        tax_total:
          type: number
          format: double
          minimum: 0
        grand_total:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
      required:
      - items
      - subtotal
      - discount_total
      - tax_total
      - grand_total
      - currency
    PriceQuoteItem:
      type: object
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
